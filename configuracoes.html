<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0a0a12"><link rel="manifest" href="/manifest.webmanifest"><title>Mestre — Configurações</title><style>body{margin:0;background:#0a0a12;color:#f4f2fb;font:15px Arial,sans-serif}main{max-width:480px;margin:auto;padding:24px 20px}a{color:#a78bfa;text-decoration:none}.top{display:flex;align-items:center;gap:14px;margin-bottom:28px}.back{font-size:24px}.card{background:#14121f;border:1px solid #2a2740;border-radius:16px;padding:18px;margin:14px 0}.title{font-size:20px;font-weight:700}.muted{color:#9d97b8;font-size:13px;line-height:1.5}label{display:block;color:#9d97b8;font-size:12px;margin:14px 0 6px}input,select{width:100%;box-sizing:border-box;background:#1c1a2b;color:#f4f2fb;border:1px solid #2a2740;border-radius:10px;padding:12px}button{width:100%;padding:13px;border:0;border-radius:10px;background:#7c3aed;color:white;font-weight:600;cursor:pointer;margin-top:12px}.secondary{background:#1c1a2b;border:1px solid #2a2740}.ok{color:#a78bfa;margin-top:10px;font-size:13px}</style></head><body><main><div class="top"><a class="back" href="/">←</a><div><div class="title">Configurações</div><div class="muted">Preferências do Mestre</div></div></div><section class="card"><div class="title">Perfil</div><label>Nome do responsável</label><input id="responsavel" placeholder="Digite seu nome"><label>Nome do estudante</label><input id="estudante" placeholder="Digite o nome do estudante"><button id="save">Salvar</button><div id="saved" class="ok"></div></section><section class="card"><div class="title">Assistente</div><label>Matéria principal</label><select disabled><option>Matemática</option></select><p class="muted">O Mestre está configurado para ensinar matemática passo a passo e adaptar a linguagem para estudantes.</p></section><section class="card" id="instalar"><div class="title">Aplicativo</div><p class="muted" id="installText">Instale o Mestre na tela inicial para abrir como aplicativo.</p><button id="install">Instalar o Mestre</button></section></main><script>const r=document.getElementById('responsavel'),e=document.getElementById('estudante');r.value=localStorage.getItem('mestre.responsavel')||'';e.value=localStorage.getItem('mestre.estudante')||'';document.getElementById('save').onclick=()=>{localStorage.setItem('mestre.responsavel',r.value.trim());localStorage.setItem('mestre.estudante',e.value.trim());document.getElementById('saved').textContent='Configurações salvas neste dispositivo.'};let deferred=null;const btn=document.getElementById('install');window.addEventListener('beforeinstallprompt',x=>{x.preventDefault();deferred=x});btn.onclick=async()=>{if(!deferred){document.getElementById('installText').textContent='O navegador ainda não liberou a instalação. Abra pelo endereço HTTPS e tente novamente.';return}deferred.prompt();await deferred.userChoice;deferred=null};if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});</script></body></html>
